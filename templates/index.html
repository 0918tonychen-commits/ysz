<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoRa 環境監測系統</title>
  <!-- Pinned + SRI: a floating "latest" tag lets an upstream release break the
       dashboard, and an unverified CDN script would run with full page trust. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT"
          crossorigin="anonymous"></script>
  <style>
    :root{--bg:#050914;--panel:#0f1720;--line:#243244;--text:#d1d8e0;--muted:#718096;--green:#39ff14;--red:#ff3158}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Consolas,monospace}main{max-width:1150px;margin:auto;padding:28px 18px}
    header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:24px}h1{font-size:24px;letter-spacing:2px}
    .badge{padding:8px 14px;border:1px solid var(--red);height:max-content}.online{color:var(--green);border-color:var(--green)}
    #error{display:none;color:#fff;background:#8b1028;padding:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:8px}.card.offline{border-color:var(--red);opacity:.78}
    .title{display:flex;justify-content:space-between;font-size:17px;margin-bottom:14px}.sensor-grid,.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .meta-grid{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}.label{color:var(--muted);font-size:11px}.value{font-size:20px}.meta-grid .value{font-size:13px}
    .foot{margin-top:14px;color:var(--muted);font-size:11px}button{background:transparent;color:var(--text);border:1px solid var(--line);padding:7px;cursor:pointer}
    #chart-panel{display:none;margin-top:20px;background:var(--panel);padding:16px}.chart-wrap{height:360px}
  </style>
</head>
<body><main>
  <header><div><h1>LORA 環境監測系統</h1><p>NTNU VEHICLE ENERGY ENGINEERING</p></div><div id="system-status" class="badge">SYSTEM.INIT</div></header>
  <div id="error" role="alert"></div><section id="grid" class="grid"></section>
  <section id="chart-panel"><button id="close-chart">CLOSE</button> <button id="export">DOWNLOAD XLSX</button><h2 id="chart-title"></h2><div class="chart-wrap"><canvas id="chart"></canvas></div></section>
</main>
<script>
"use strict";
const META_FIELDS=["rssi","snr","hop_rssi","hop_snr","mcount","loss","via","level","fallback"];
// Sensors with different units must not share a Y axis. On one scale CO2 in the
// hundreds sets the range and flattens temperature and humidity into a line
// along the bottom, which hides exactly the variation the chart is for. One
// axis per unit instead, so every series is scaled against its own range.
const SENSOR_UNITS={temperature:"°C",humidity:"%",co2:"ppm",pm25:"µg/m³",pm10:"µg/m³",voltage:"V"};
const AXIS_LIMIT=4;  // past this the axis gutters cost more than they explain
const TICK="#718096",GRID="#243244",LABEL="#d1d8e0";
function unitOf(sensor){return SENSOR_UNITS[sensor]||"";}
function axisOf(sensor){return unitOf(sensor)||sensor;}
let activeNode=null,pollTimer=null,retryDelay=2000;
const errorBox=document.getElementById("error"),grid=document.getElementById("grid"),statusBadge=document.getElementById("system-status"),chartPanel=document.getElementById("chart-panel"),chartTitle=document.getElementById("chart-title");
// A blocked/failed CDN script must not take the live dashboard down with it,
// so every use of Chart/XLSX is guarded and the rest of the page keeps working.
const chartReady=typeof Chart==="function",xlsxReady=typeof XLSX==="object"&&XLSX!==null;
const chart=chartReady?new Chart(document.getElementById("chart"),{type:"line",data:{labels:[],datasets:[]},options:{
  responsive:true,maintainAspectRatio:false,spanGaps:false,
  // One hover reads every series at that timestamp, which is how you compare
  // them once they no longer share a scale.
  interaction:{mode:"index",intersect:false},
  plugins:{
    legend:{labels:{color:LABEL,boxWidth:12}},
    tooltip:{callbacks:{label:item=>` ${item.dataset.label}: ${item.formattedValue}`}},
  },
}}):null;
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node;}
function valueCell(parent,label,value){const box=element("div");box.append(element("div","label",label),element("div","value",value??"--"));parent.append(box);}
function formatTime(epoch){return Number.isFinite(epoch)?new Date(epoch*1000).toLocaleString("zh-TW",{hour12:false}):"--";}
function radioMetaForDisplay(meta){
  const values={...(meta||{})},via=Array.isArray(values.via)?values.via:[];
  // A direct node has no relay hop, so a missing hop metric is not an error.
  if(!via.length){
    if(values.hop_rssi===undefined||values.hop_rssi===null)values.hop_rssi="N/A";
    if(values.hop_snr===undefined||values.hop_snr===null)values.hop_snr="N/A";
  // Relayed packets arrive with hop SNR(s) first and gateway SNR last.
  }else if((values.hop_snr===undefined||values.hop_snr===null)&&Array.isArray(values.snr)&&values.snr.length===via.length+1){
    values.hop_snr=values.snr.slice(0,-1);
    values.snr=values.snr.at(-1);
  }
  return values;
}
function renderCards(response){
  grid.replaceChildren();const nodes=response.nodes||{};
  for(const id of Object.keys(nodes).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))){
    const node=nodes[id]||{},card=element("article",`card${node.online?"":" offline"}`),title=element("div","title");
    title.append(element("span","",id.toUpperCase()),element("span","",node.online?"ONLINE":"OFFLINE"));card.append(title);
    const sensors=element("div","sensor-grid");for(const [name,value] of Object.entries(node.data||{}))valueCell(sensors,name.toUpperCase(),value);card.append(sensors);
    const meta=element("div","meta-grid"),values=radioMetaForDisplay(node.meta);for(const name of META_FIELDS){let value=values[name];if(name==="via"&&Array.isArray(value))value=value.length?value.join(" → "):"DIRECT";else if(Array.isArray(value))value=value.join(" / ");if(name==="level"&&Number.isFinite(value))value=`L${value}`;if(name==="fallback"&&value!==undefined&&value!==null)value=value?"備援中":"主線";valueCell(meta,name.toUpperCase(),value);}card.append(meta);
    card.append(element("div","foot",`LAST SEEN: ${formatTime(node.last_seen)} · EVENT: ${formatTime(node.recorded_at)}`));card.addEventListener("click",()=>openChart(id));grid.append(card);
  }
  const online=response.status==="online";statusBadge.className=`badge${online?" online":""}`;statusBadge.textContent=online?"SYSTEM.ONLINE":"SYSTEM.OFFLINE";
}
function renderChart(history){
  if(!chart)return;
  chart.data.labels=history.labels||[];
  const keys=Object.keys(history).filter(key=>key!=="labels");
  const axes=[...new Set(keys.map(axisOf))];
  const scales={x:{ticks:{color:TICK,maxTicksLimit:10},grid:{color:GRID}}};
  axes.forEach((axis,index)=>{
    const shown=index<AXIS_LIMIT;
    scales[`y${index}`]={
      type:"linear",
      position:index%2?"right":"left",
      display:shown,
      title:{display:shown,text:axis,color:TICK},
      ticks:{color:TICK},
      // Only the first axis draws horizontal lines; stacking them turns the
      // plot into a grey wash.
      grid:{drawOnChartArea:index===0,color:GRID},
    };
  });
  chart.data.datasets=keys.map((key,index)=>{
    const unit=unitOf(key);
    return {
      label:unit?`${key.toUpperCase()} (${unit})`:key.toUpperCase(),
      yAxisID:`y${axes.indexOf(axisOf(key))}`,
      data:(history[key]||[]).map(value=>value===null||value===undefined?null:Number(value)),
      borderColor:`hsl(${(index*83)%360} 80% 60%)`,
      backgroundColor:`hsl(${(index*83)%360} 80% 60%)`,
      tension:.25,
      pointRadius:0,
      pointHitRadius:8,
    };
  });
  chart.options.scales=scales;
  chart.update();
}
function showError(message){errorBox.textContent=`資料連線錯誤：${message}`;errorBox.style.display="block";statusBadge.className="badge";statusBadge.textContent="SYSTEM.ERROR";}
async function openChart(id){activeNode=id;chartTitle.textContent=id.toUpperCase();chartPanel.style.display="block";if(!chartReady)return;try{const response=await fetch(`/api/history_range/${encodeURIComponent(id)}?days=7`);if(!response.ok)throw new Error(`History HTTP ${response.status}`);renderChart(await response.json());}catch(error){showError(error.message);}}
async function poll(){try{const response=await fetch("/api/all_data",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);renderCards(await response.json());errorBox.style.display="none";retryDelay=2000;pollTimer=setTimeout(poll,3000);}catch(error){showError(error.message);pollTimer=setTimeout(poll,retryDelay);retryDelay=Math.min(retryDelay*2,30000);}}
function historyToSheet(history){const keys=Object.keys(history).filter(key=>key!=="labels"),rows=[["Time",...keys.map(key=>key.toUpperCase())]];(history.labels||[]).forEach((label,index)=>rows.push([label,...keys.map(key=>{const value=history[key]?.[index];return value===null||value===undefined?null:Number(value);})]));return XLSX.utils.aoa_to_sheet(rows);}
document.getElementById("close-chart").addEventListener("click",()=>{activeNode=null;chartPanel.style.display="none";});
document.getElementById("export").addEventListener("click",async()=>{if(!activeNode)return;if(!xlsxReady){showError("XLSX 匯出元件載入失敗,無法匯出");return;}try{const [rawResponse,hourlyResponse]=await Promise.all([fetch(`/api/history_range/${encodeURIComponent(activeNode)}?days=7`),fetch(`/api/history_hourly/${encodeURIComponent(activeNode)}?days=90`)]);if(!rawResponse.ok||!hourlyResponse.ok)throw new Error("Export request failed");const raw=await rawResponse.json(),hourly=await hourlyResponse.json(),book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,historyToSheet(raw),"7d_raw");XLSX.utils.book_append_sheet(book,historyToSheet(hourly),"90d_hourly");XLSX.writeFile(book,`${activeNode}_DATA.xlsx`);}catch(error){showError(error.message);}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){clearTimeout(pollTimer);poll();}});poll();
</script></body></html>
