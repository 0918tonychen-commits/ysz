<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoRa SCADA 智能監控中心</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ── 完整 CSS 渲染 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c10; --surface: #0f1720; --surface2: #1a2535;
      --border: rgba(0, 210, 255, 0.12); --border-hover: rgba(0, 210, 255, 0.45);
      --cyan: #00d2ff; --green: #00ff88; --red: #ff6384; --blue: #36a2eb;
      --text: #e2e8f0; --muted: #64748b; --radius: 16px;
    }
    body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1000px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
    .header h1 { font-size: 1.5rem; color: var(--cyan); letter-spacing: 2px; }
    .status-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 999px; font-size: 0.72rem; }
    .status-badge.is-online { border-color: var(--green); color: var(--green); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .dot.pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .scada-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .card:hover { transform: translateY(-4px); border-color: var(--border-hover); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .card.active { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,210,255,0.15); }
    .card-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    .val-item { margin-bottom: 8px; }
    .val-label { font-size: 0.6rem; color: var(--muted); margin-bottom: 2px; }
    .val-num { font-size: 1.4rem; font-weight: 700; }

    .chart-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); max-height: 0; opacity: 0; overflow: hidden; transition: 0.5s ease; margin-top: 20px; }
    .chart-panel.show { max-height: 500px; opacity: 1; padding: 20px; border-color: var(--cyan); }
    .btn { background: var(--surface2); border: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
    .btn:hover { color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div><h1>LoRa SCADA</h1><p style="color:var(--muted); font-size:0.65rem;">CAMPUS MONITORING CENTER</p></div>
    <div id="status-badge" class="status-badge"><span class="dot" id="status-dot"></span><span id="status-text">OFFLINE</span></div>
  </div>

  <div id="scada-grid" class="scada-grid"></div>

  <div id="chart-panel" class="chart-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <span id="chart-title" style="color:var(--muted); font-size:0.8rem;">歷史趨勢</span>
      <div><button class="btn" onclick="exportCSV()" style="margin-right:8px;">📥 匯出</button><button class="btn" onclick="closeChart()">✕</button></div>
    </div>
    <div style="height:320px; width:100%;"><canvas id="myChart"></canvas></div>
  </div>
</div>

<script>
// ── 1. 核心配置：只需在此增加或修改節點 ──
const SENSOR_CONFIG = {
  s01: { name: '節點1', icon: '📍', sensors: ['t', 'h'] },
  s02: { name: '節點2', icon: '📍', sensors: ['c', 't', 'h'] },
  s03: { name: '節點3', icon: '📍', sensors: ['pm25', 'pm10'] },
  s04: { name: '節點4', icon: '📍', sensors: ['t', 'h'] },
  s05: { name: '節點5', icon: '📍', sensors: ['t', 'h'] },
};

let activeNode = null;
const ctx = document.getElementById('myChart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line', data: { labels: [], datasets: [] },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
    scales: {
      x: { ticks: { color: '#64748b' }, grid: { display: false } },
      y: { ticks: { color: '#e2e8f0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
      y1: { position: 'right', display: false, ticks: { color: '#00ff88' }, grid: { drawOnChartArea: false } }
    }
  }
});

// ── 2. 動態生成與更新 ──
function initCards() {
  const grid = document.getElementById('scada-grid');
  grid.innerHTML = '';
  Object.entries(SENSOR_CONFIG).forEach(([id, conf]) => {
    const card = document.createElement('div');
    card.className = 'card'; card.id = `card-${id}`;
    card.onclick = () => toggleChart(id);
    let sensors = '';
    conf.sensors.forEach(s => {
      const color = s === 't' ? 'var(--red)' : s === 'h' ? 'var(--blue)' : 'var(--green)';
      sensors += `<div class="val-item"><div class="val-label">${s.toUpperCase()}</div><div class="val-num" style="color:${color}"><span id="${id}-${s}">--</span></div></div>`;
    });
    card.innerHTML = `<div class="card-title">${conf.icon} ${conf.name}</div>${sensors}`;
    grid.appendChild(card);
  });
}

function updateUI(data) {
  Object.entries(SENSOR_CONFIG).forEach(([id, conf]) => {
    conf.sensors.forEach(s => {
      const el = document.getElementById(`${id}-${s}`);
      if (el) {
        const valObj = data[`${id}_${s}`] || (s === 'c' ? data[`${id}_c`] : null);
        el.textContent = valObj?.val || '--';
      }
    });
  });
  const isOnline = data.status === 'online';
  document.getElementById('status-badge').className = `status-badge ${isOnline ? 'is-online' : ''}`;
  document.getElementById('status-dot').className = `dot ${isOnline ? 'pulse' : ''}`;
  document.getElementById('status-text').textContent = isOnline ? 'ONLINE' : 'OFFLINE';
  if (activeNode && data.history[activeNode]) renderChart(activeNode, data.history[activeNode]);
}

// ── 3. 智慧雙 Y 軸渲染演算法 (自動偵測倍率斷層) ──
function renderChart(id, h) {
  chart.data.labels = h.labels;
  const dataKeys = Object.keys(h).filter(k => k !== 'labels');
  const stats = dataKeys.map(key => ({ key, data: (h[key] ?? []).map(Number), max: Math.max(...(h[key]??[]).map(Number), 1) }));
  
  const sorted = [...stats].sort((a, b) => a.max - b.max);
  let splitIdx = -1;
  for (let i = 0; i < sorted.length - 1; i++) {
    if (sorted[i+1].max / sorted[i].max > 5) splitIdx = i;
  }

  const needsSplit = splitIdx !== -1;
  chart.options.scales.y1.display = needsSplit;

  chart.data.datasets = stats.map(s => {
    const isRight = needsSplit && (sorted.findIndex(i => i.key === s.key) > splitIdx);
    return {
      label: s.key.toUpperCase(), data: s.data, yAxisID: isRight ? 'y1' : 'y',
      borderColor: s.key==='temp'?'#ff6384':s.key==='hum'?'#36a2eb':s.key==='co2'?'#00ff88':'#f9ca24',
      tension: 0.4, pointRadius: 1
    };
  });
  chart.update('none');
}

// ── 4. 工具函式 ──
async function fetchData() {
  try { const res = await fetch('/api/all_data'); updateUI(await res.json()); } catch(e){}
}
function toggleChart(id) {
  activeNode = id;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.getElementById(`card-${id}`).classList.add('active');
  document.getElementById('chart-panel').classList.add('show');
  document.getElementById('chart-title').innerText = `${SENSOR_CONFIG[id].name} · 歷史分析`;
  fetchData();
}
function closeChart() { activeNode = null; document.getElementById('chart-panel').classList.remove('show'); }
function exportCSV() {
  if (!activeNode) return;
  fetch('/api/all_data').then(res => res.json()).then(data => {
    const hist = data.history[activeNode];
    const keys = Object.keys(hist).filter(k => k !== 'labels');
    let csv = "\uFEFFTime," + keys.join(",") + "\n";
    for (let i = 0; i < hist.labels.length; i++) {
      let row = [hist.labels[i]];
      keys.forEach(k => row.push(hist[k][i]));
      csv += row.join(",") + "\n";
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${activeNode}_data.csv`; a.click();
  });
}

initCards();
setInterval(fetchData, 3000);
fetchData();
</script>
</body>
</html>
