<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>LoRa SCADA 智能監控中心</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ── 🌌 終極 Cyberpunk 科技感渲染 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root { 
      --bg: #050914; 
      --surface: rgba(15, 23, 32, 0.85); 
      --cyan: #00f0ff; 
      --green: #39ff14; 
      --red: #ff003c; 
      --blue: #0088ff; 
      --muted: #4b6584; 
      --text: #d1d8e0; 
      --grid-line: rgba(0, 240, 255, 0.05);
    }

    body { 
      font-family: 'Consolas', 'Courier New', monospace; 
      background-color: var(--bg);
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text); 
      padding: 30px 20px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 1100px; }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid var(--grid-line); padding-bottom: 15px; }
    .header h1 { font-size: 1.8rem; color: var(--cyan); letter-spacing: 3px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); text-transform: uppercase; margin-bottom: 5px; }
    
    .status-badge { 
      padding: 6px 16px; border-radius: 4px; border: 1px solid var(--muted); 
      font-size: 0.75rem; background: rgba(0,0,0,0.5); letter-spacing: 1px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .is-online { border-color: var(--green); color: var(--green); text-shadow: 0 0 8px var(--green); box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2); }
    .pulse { display: inline-block; width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 8px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1; box-shadow:0 0 8px currentColor;} 50%{opacity:0.2; box-shadow:none;} }

    /* 圖一：卡片換行佈局 */
    .scada-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; transition: 0.4s; }
    
    .card { 
      background: var(--surface); 
      border: 1px solid rgba(0, 240, 255, 0.2); 
      border-radius: 8px; 
      padding: 20px; cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--muted); transition: 0.3s; }
    .card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.1); }
    .card:hover::before { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    
    .card.active { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 240, 255, 0.2); background: rgba(0, 240, 255, 0.05); }
    .card.active::before { background: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
    
    /* 隱形功能 (圖二) */
    .hidden { display: none !important; }

    .card-title { font-size: 0.8rem; color: var(--text); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
    
    .val-container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .val-item { flex: 1 1 40%; }
    .val-label { font-size: 0.6rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .val-num { font-size: 1.6rem; font-weight: bold; text-shadow: 0 0 10px currentColor; }

    /* 圖二：圖表面板渲染 */
    .chart-panel { 
      background: var(--surface); border-radius: 8px; border: 1px solid var(--cyan); 
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); max-height: 0; opacity: 0; overflow: hidden; 
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); margin-top: 20px; 
    }
    .chart-panel.show { max-height: 600px; opacity: 1; padding: 20px; }

    .chart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px dashed rgba(0, 240, 255, 0.3); margin-bottom: 15px; }
    
    /* 橫向滾動外框 */
    .chart-scroll-box { width: 100%; overflow-x: auto; background: #02040a; border-radius: 4px; padding: 10px; border: 1px solid #111b27; }
    .chart-scroll-box::-webkit-scrollbar { height: 8px; }
    .chart-scroll-box::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 4px; }
    .chart-scroll-box::-webkit-scrollbar-track { background: #02040a; }
    .chart-content { min-width: 1200px; height: 350px; position: relative; } 

    .btn { 
      background: transparent; border: 1px solid var(--cyan); color: var(--cyan); 
      padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; 
      text-transform: uppercase; transition: 0.3s; box-shadow: inset 0 0 5px rgba(0,240,255,0.2);
    }
    .btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>SYS.SCADA //</h1>
      <p style="color:var(--muted); font-size:0.7rem; letter-spacing:1px;">NTNU VEHICLE ENERGY - MULTI NODE</p>
    </div>
    <div id="status-badge" class="status-badge"><span class="pulse" id="status-dot"></span><span id="status-text">OFFLINE</span></div>
  </div>

  <div id="scada-grid" class="scada-grid"></div>

  <div id="chart-panel" class="chart-panel">
    <div class="chart-header">
      <div id="legend-container" style="display:flex; gap:20px; font-size:0.85rem; align-items:center;"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="exportCSV()">[ DOWNLOAD.CSV ]</button> 
        <button class="btn" style="border-color:var(--red); color:var(--red);" onclick="closeChart()">[ CLOSE ]</button>
      </div>
    </div>
    <div class="chart-scroll-box">
      <div class="chart-content">
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ── 1. 系統配置 ──
const SENSOR_CONFIG = {
  s01: { name: 'NODE_01', icon: '📍', sensors: ['t', 'h'] },
  s02: { name: 'NODE_02', icon: '📍', sensors: ['c', 't', 'h'] },
  s03: { name: 'NODE_03', icon: '📍', sensors: ['pm25', 'pm10'] },
  s04: { name: 'NODE_04', icon: '📍', sensors: ['t', 'h'] },
  s05: { name: 'NODE_05', icon: '📍', sensors: ['t', 'h'] },
};

let activeNode = null;
let chart = null;

// ── 2. 優先渲染介面 (防呆機制：確保不管圖表載入成功與否，卡片都會先出來) ──
function initCards() {
  const grid = document.getElementById('scada-grid');
  Object.entries(SENSOR_CONFIG).forEach(([id, conf]) => {
    const card = document.createElement('div');
    card.className = 'card'; card.id = `card-${id}`;
    card.onclick = () => toggleChart(id);
    
    let html = `<div class="card-title">${conf.icon} ${conf.name}</div><div class="val-container">`;
    conf.sensors.forEach(s => {
      const color = s === 't' ? 'var(--red)' : s === 'h' ? 'var(--blue)' : 'var(--green)';
      html += `<div class="val-item"><div class="val-label">${s.toUpperCase()}</div><div class="val-num" style="color:${color}"><span id="${id}-${s}">--</span></div></div>`;
    });
    card.innerHTML = html + `</div>`; 
    grid.appendChild(card);
  });
}
initCards(); // 立即執行

// ── 3. 安全初始化圖表 ──
try {
  const ctx = document.getElementById('myChart').getContext('2d');
  Chart.defaults.color = '#64748b';
  Chart.defaults.font.family = 'Consolas';
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } }, 
      scales: {
        x: { grid: { color: 'rgba(0, 240, 255, 0.05)' } },
        y: { grid: { color: 'rgba(0, 240, 255, 0.05)' } },
        y1: { position: 'right', display: false, grid: { drawOnChartArea: false } }
      }
    }
  });
} catch (error) {
  console.warn("圖表模組載入中或發生錯誤，但不影響數據監控。", error);
}

// ── 4. 聚焦模式邏輯 ──
function toggleChart(id) {
  activeNode = id;
  document.querySelectorAll('.card').forEach(c => {
    if (c.id === `card-${id}`) {
      c.classList.remove('hidden');
      c.classList.add('active');
    } else {
      c.classList.add('hidden'); 
    }
  });
  document.getElementById('chart-panel').classList.add('show');
  fetchData();
}

function closeChart() { 
  activeNode = null; 
  document.getElementById('chart-panel').classList.remove('show'); 
  setTimeout(() => {
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('hidden');
      c.classList.remove('active');
    });
  }, 300); 
}

// ── 5. 圖表渲染 ──
function renderChart(id, h) {
  if (!chart) return; // 防呆：圖表未載入完成時跳過畫圖，但不影響卡片
  chart.data.labels = h.labels;
  const datasets = [];
  const legendBox = document.getElementById('legend-container');
  legendBox.innerHTML = `<span style="color:var(--cyan); font-weight:bold; border-right:2px solid var(--muted); padding-right:15px;">DATA STREAM // ${SENSOR_CONFIG[id].name}</span>`;
  
  const colorMap = { temp: '#ff003c', hum: '#0088ff', co2: '#39ff14', pm25: '#39ff14', pm10: '#f9ca24' };
  const keys = Object.keys(h).filter(k => k !== 'labels');
  
  const stats = keys.map(k => ({ key: k, max: Math.max(...(h[k]??[]).map(Number), 1) }));
  const sorted = [...stats].sort((a,b) => a.max - b.max);
  let splitIdx = -1;
  for(let i=0; i<sorted.length-1; i++) if(sorted[i+1].max / sorted[i].max > 5) splitIdx = i;

  keys.forEach(k => {
    const isRight = splitIdx !== -1 && (sorted.findIndex(s => s.key === k) > splitIdx);
    const color = colorMap[k] || '#00d2ff';
    
    legendBox.innerHTML += `<span style="color:${color}; text-shadow:0 0 5px ${color};">■ ${k.toUpperCase()}</span>`;
    
    datasets.push({
      label: k.toUpperCase(), data: (h[k] ?? []).map(Number),
      borderColor: color, backgroundColor: color,
      yAxisID: isRight ? 'y1' : 'y',
      borderWidth: 2, tension: 0.3, pointRadius: 2, pointBackgroundColor: '#050914' 
    });
    if(isRight) chart.options.scales.y1.display = true;
  });

  chart.data.datasets = datasets;
  chart.update('none');
  
  const scrollBox = document.querySelector('.chart-scroll-box');
  if(scrollBox) scrollBox.scrollLeft = scrollBox.scrollWidth;
}

// ── 6. 數據通訊 ──
async function fetchData() {
  try {
    const res = await fetch('/api/all_data');
    const data = await res.json();
    Object.entries(SENSOR_CONFIG).forEach(([id, conf]) => {
      conf.sensors.forEach(s => {
        const el = document.getElementById(`${id}-${s}`);
        // 簡化邏輯，精準抓取 Python 丟來的 Key
        if(el) el.textContent = data[`${id}_${s}`]?.val || '--';
      });
    });
    const isOnline = data.status === 'online';
    document.getElementById('status-badge').className = `status-badge ${isOnline ? 'is-online' : ''}`;
    document.getElementById('status-text').textContent = isOnline ? 'SYSTEM.ONLINE' : 'SYSTEM.OFFLINE';
    if(activeNode && data.history[activeNode]) renderChart(activeNode, data.history[activeNode]);
  } catch(e){}
}

// ── 7. 補回 CSV 下載功能 ──
function exportCSV() {
  if (!activeNode) return;
  fetch('/api/all_data').then(res => res.json()).then(data => {
    const hist = data.history[activeNode];
    const ks = Object.keys(hist).filter(k => k !== 'labels');
    let csv = "\uFEFFTime," + ks.join(",") + "\n";
    for(let i=0; i<hist.labels.length; i++) {
      let r = [hist.labels[i]]; ks.forEach(k => r.push(hist[k][i])); csv += r.join(",") + "\n";
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${activeNode}_DATA.csv`; a.click();
  });
}

setInterval(fetchData, 3000);
fetchData();
</script>
</body>
</html>
