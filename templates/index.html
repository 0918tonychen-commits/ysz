<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa SCADA 智能監控中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- 維持原本優美的 CSS 樣式 --- */
        body { font-family: 'Segoe UI', sans-serif; background: #0b1016; color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 950px; background: rgba(20, 26, 35, 0.85); padding: 30px; border-radius: 28px; border: 1px solid rgba(0, 210, 255, 0.2); backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #00d2ff; font-size: 1.8rem; margin: 0; text-shadow: 0 0 15px rgba(0,210,255,0.5); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .online { background: #00ff88; box-shadow: 0 0 12px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .offline { background: #ff4757; box-shadow: 0 0 10px #ff4757; }
        .scada-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 20px; padding: 22px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: #00d2ff; }
        .card.active { background: rgba(0, 210, 255, 0.1); border-color: #00d2ff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        .val-row { display: flex; justify-content: space-around; margin-top: 15px; flex-wrap: wrap; }
        .val-item { text-align: center; padding: 5px; }
        .temp-color { color: #ff6384; filter: drop-shadow(0 0 5px #ff6384); }
        .hum-color { color: #36a2eb; filter: drop-shadow(0 0 5px #36a2eb); }
        .air-color { color: #00ff88; filter: drop-shadow(0 0 5px #00ff88); }
        .vib-color { color: #ff9f43; filter: drop-shadow(0 0 5px #ff9f43); }
        .chart-wrapper { max-height: 0; overflow: hidden; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        .chart-wrapper.show { max-height: 500px; opacity: 1; padding-top: 25px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        canvas { width: 100% !important; height: 320px !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LoRa SCADA 監控系統</h1>
            <div class="status-tag">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">SYSTEM OFFLINE</span>
            </div>
        </div>
        
        <div id="scada-grid" class="scada-grid"></div>

        <div id="chart-area" class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
        <p style="text-align:center; color:#475569; margin-top:20px; font-size: 0.9rem;">⚡ 點擊卡片切換即時趨勢圖</p>
    </div>

    <script>
        // --- 1. 配置感測器清單 (優化 SCD30 為 air_all) ---
        const sensorConfig = {
            "s01": { name: "1號環境站", icon: "🌡️", type: "env" },
            "s02": { name: "空氣品質全監測", icon: "🌬️", type: "air_all" }, // 三合一站點
            "s03": { name: "設備監測站", icon: "🚜", type: "machine" }
        };

        let currentActiveNode = null;
        let units = {}; 
        const ctx = document.getElementById('myChart').getContext('2d');
        
        // --- 2. 初始化 Chart.js (配置雙 Y 軸) ---
        const myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false }, // 滑鼠移上去顯示同時間所有數據
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                    // 左側 Y 軸：溫濕度、震動
                    y: { 
                        type: 'linear', display: true, position: 'left',
                        ticks: { color: '#ff6384' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        title: { display: true, text: '溫濕度 / 震動', color: '#94a3b8' }
                    },
                    // 右側 Y 軸：CO2
                    y1: { 
                        type: 'linear', display: true, position: 'right',
                        ticks: { color: '#00ff88' },
                        grid: { drawOnChartArea: false }, // 避免網格線打架
                        title: { display: true, text: 'CO2 (ppm)', color: '#94a3b8' }
                    }
                }
            }
        });

        // --- 3. 動態建立卡片 ---
        function createCards() {
            const grid = document.getElementById('scada-grid');
            Object.keys(sensorConfig).forEach(id => {
                const conf = sensorConfig[id];
                let content = "";
                
                if (conf.type === "env") {
                    content = `<div class="val-item"><h2 class="temp-color"><span id="${id}-t">--</span><small id="${id}-t-unit"></small></h2></div>
                               <div class="val-item"><h2 class="hum-color"><span id="${id}-h">--</span><small id="${id}-h-unit"></small></h2></div>`;
                } else if (conf.type === "air_all") {
                    // 三合一版面：CO2 放大，溫濕度並列下方
                    content = `
                        <div style="width:100%; text-align:center; margin-bottom:10px;">
                            <h2 class="air-color" style="margin:5px 0;"><span id="${id}-co2">--</span><small id="${id}-co2-unit"></small></h2>
                        </div>
                        <div class="val-row" style="width:100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top:10px;">
                            <div class="temp-color"><span id="${id}-t">--</span>°C</div>
                            <div class="hum-color"><span id="${id}-h">--</span>%</div>
                        </div>`;
                } else if (conf.type === "machine") {
                    content = `<div class="val-item"><h2 class="vib-color"><span id="${id}-vib">--</span><small id="${id}-vib-unit"></small></h2></div>`;
                }

                grid.insertAdjacentHTML('beforeend', `
                    <div class="card" id="card-${id}" onclick="toggleChart('${id}')">
                        <h3 style="margin:0; font-size:1rem; color:#94a3b8">${conf.icon} ${conf.name}</h3>
                        <div class="val-row">${content}</div>
                    </div>`);
            });
        }

        function toggleChart(nodeId) {
            const wrapper = document.getElementById('chart-area');
            const cards = document.querySelectorAll('.card');
            if (currentActiveNode === nodeId) {
                currentActiveNode = null;
                wrapper.classList.remove('show');
                cards.forEach(c => c.classList.remove('active'));
            } else {
                currentActiveNode = nodeId;
                wrapper.classList.add('show');
                cards.forEach(c => c.classList.remove('active'));
                document.getElementById(`card-${nodeId}`).classList.add('active');
                fetchData();
            }
        }

        // --- 4. 數據抓取與雙 Y 軸更新 ---
        function fetchData() {
            fetch('/api/all_data')
                .then(res => res.json())
                .then(data => {
                    units = data.units || {}; 
                    
                    Object.keys(sensorConfig).forEach(id => {
                        const metrics = ["t", "h", "co2", "voc", "vib"];
                        metrics.forEach(m => {
                            const valElem = document.getElementById(`${id}-${m}`);
                            const unitElem = document.getElementById(`${id}-${m}-unit`);
                            if (valElem && data[`${id}_${m}`]) {
                                valElem.innerText = data[`${id}_${m}`].val;
                                if (unitElem && units[m]) unitElem.innerText = units[m];
                            }
                        });
                    });

                    const isOnline = data.status === 'online';
                    document.getElementById('status-text').innerText = isOnline ? 'SYSTEM ONLINE' : 'SYSTEM OFFLINE';
                    document.getElementById('status-dot').className = `status-dot ${isOnline ? 'online' : 'offline'}`;

                    if (currentActiveNode && data.history && data.history[currentActiveNode]) {
                        const h = data.history[currentActiveNode];
                        const type = sensorConfig[currentActiveNode].type;
                        myChart.data.labels = h.labels || [];
                        let newDatasets = [];

                        // 判斷是否需要啟用右側 Y 軸
                        myChart.options.scales.y1.display = (type === "air_all");

                        if (type === "env") {
                            newDatasets = [
                                { label: `溫度 (${units.t})`, data: h.temp, borderColor: '#ff6384', yAxisID: 'y', tension: 0.4 },
                                { label: `濕度 (${units.h})`, data: h.hum, borderColor: '#36a2eb', yAxisID: 'y', tension: 0.4 }
                            ];
                        } else if (type === "air_all") {
                            newDatasets = [
                                { label: `CO2 (${units.co2})`, data: h.co2, borderColor: '#00ff88', yAxisID: 'y1', tension: 0.4, fill: true, backgroundColor: 'rgba(0,255,136,0.1)' },
                                { label: `溫度 (${units.t})`, data: h.temp, borderColor: '#ff6384', yAxisID: 'y', tension: 0.4 },
                                { label: `濕度 (${units.h})`, data: h.hum, borderColor: '#36a2eb', yAxisID: 'y', tension: 0.4 }
                            ];
                        } else if (type === "machine") {
                            newDatasets = [
                                { label: `震動 (${units.vib})`, data: h.vib, borderColor: '#ff9f43', yAxisID: 'y', tension: 0.4 }
                            ];
                        }

                        myChart.data.datasets = newDatasets;
                        myChart.update('none'); 
                    }
                });
        }

        createCards();
        fetchData();
        setInterval(fetchData, 3000); 
    </script>
</body>
</html>
