<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa 數據監控中心 | 科技互動版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 科技感深色背景與字體設定 */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0b1016; 
            color: #e2e8f0; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 850px; 
            background: #141a23; 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid #2d3748;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00d2ff; font-size: 1.6rem; margin: 0; text-shadow: 0 0 10px rgba(0,210,255,0.3); }

        /* 狀態燈號 */
        .status-tag { font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .offline { background: #ff4757; box-shadow: 0 0 10px #ff4757; }

        /* 交互式數據卡片 */
        .card-container { display: flex; gap: 20px; margin-top: 20px; }
        .card {
            background: #1a222c;
            border: 2px solid #2d3748;
            border-radius: 18px;
            padding: 25px;
            flex: 1;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        
        .card:hover { border-color: #00d2ff; background: #1f2937; transform: translateY(-5px); }
        .card.active { border-color: #00d2ff; background: #1f2937; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }

        .card h3 { color: #94a3b8; font-size: 0.9rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .card h2 { font-size: 3rem; margin: 15px 0; font-family: 'Consolas', monospace; font-weight: bold; }
        
        #temp-display { color: #ff6384; text-shadow: 0 0 15px rgba(255, 99, 132, 0.2); }
        #hum-display { color: #36a2eb; text-shadow: 0 0 15px rgba(54, 162, 235, 0.2); }

        /* 圖表區域：修正高度問題 */
        .chart-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            opacity: 0;
            background: #0f172a;
            border-radius: 15px;
            margin-top: 0;
        }

        .chart-wrapper.show {
            max-height: 450px; /* 足夠的展開高度 */
            opacity: 1;
            padding: 25px;
            margin-top: 25px;
            border: 1px solid #1f2937;
        }

        canvas { width: 100% !important; height: 320px !important; } /* 強制固定繪圖高度 */

        .hint { color: #475569; font-size: 0.8rem; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LoRa 實時監測系統</h1>
            <div class="status-tag">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>
        
        <div class="card-container">
            <div class="card" id="temp-card" onclick="toggleChart('temp')">
                <h3>環境溫度</h3>
                <h2 id="temp-display">--<small style="font-size:1.2rem; margin-left:5px;">°C</small></h2>
            </div>
            <div class="card" id="hum-card" onclick="toggleChart('hum')">
                <h3>環境濕度</h3>
                <h2 id="hum-display">--<small style="font-size:1.2rem; margin-left:5px;">%</small></h2>
            </div>
        </div>

        <div id="chart-area" class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>

        <p class="hint">💡 點擊上方卡片可切換查看歷史數據圖表</p>
    </div>

    <script>
        let currentMode = null; 
        const chartWrapper = document.getElementById('chart-area');
        const ctx = document.getElementById('myChart').getContext('2d');

        // Chart.js 預設風格設定
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = 'Segoe UI';

        const myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], fill: true, tension: 0.4, borderWidth: 3 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    x: { grid: { display: false }, ticks: { maxRotation: 0 } }, 
                    y: { grid: { color: 'rgba(255,255,255,0.05)' } } 
                },
                animation: { duration: 1000 }
            }
        });

        // 切換顯示邏輯
        function toggleChart(mode) {
            const tempCard = document.getElementById('temp-card');
            const humCard = document.getElementById('hum-card');

            if (currentMode === mode) {
                currentMode = null;
                chartWrapper.classList.remove('show');
                tempCard.classList.remove('active');
                humCard.classList.remove('active');
            } else {
                currentMode = mode;
                chartWrapper.classList.add('show');
                tempCard.classList.toggle('active', mode === 'temp');
                humCard.classList.toggle('active', mode === 'hum');

                // 確保 CSS 動畫進行中也能正確計算圖表大小
                setTimeout(() => {
                    updateChartStyle();
                    myChart.resize(); 
                }, 350);
            }
        }

        // 根據選取的模式更新圖表顏色
        function updateChartStyle() {
            const dataset = myChart.data.datasets[0];
            if (currentMode === 'temp') {
                dataset.borderColor = '#ff6384';
                dataset.backgroundColor = 'rgba(255, 99, 132, 0.1)';
            } else {
                dataset.borderColor = '#36a2eb';
                dataset.backgroundColor = 'rgba(54, 162, 235, 0.1)';
            }
            myChart.update();
        }

        // 抓取雲端後端數據
        function fetchData() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    // 更新數值顯示 (自動適應 bridge.py 傳來的純數字格式)
                    document.getElementById('temp-display').innerHTML = `${data.temperature}<small style="font-size:1.2rem; margin-left:5px;">°C</small>`;
                    document.getElementById('hum-display').innerHTML = `${data.humidity}<small style="font-size:1.2rem; margin-left:5px;">%</small>`;
                    
                    // 狀態更新
                    const statusText = document.getElementById('status-text');
                    const statusDot = document.getElementById('status-dot');
                    statusText.innerText = data.status.toUpperCase();
                    statusDot.className = 'status-dot ' + (data.status === 'online' ? 'online' : 'offline');

                    // 若圖表為展開狀態則更新歷史數據
                    if (currentMode) {
                        myChart.data.labels = data.history.labels;
                        myChart.data.datasets[0].data = (currentMode === 'temp') ? data.history.temp : data.history.hum;
                        myChart.update('none'); 
                    }
                })
                .catch(err => console.error("連線錯誤:", err));
        }

        // 設定更新頻率 (3秒)
        setInterval(fetchData, 3000); 
        fetchData();
    </script>
</body>
</html>
