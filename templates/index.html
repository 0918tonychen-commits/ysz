<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa 實時監測站 | 互動版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0b1016; 
            color: #e0e6ed; 
            margin: 0; 
            padding: 20px;
        }

        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #141a23; 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid #2d3748;
        }

        /* 讓卡片看起來可以點擊 */
        .card-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .card {
            background: #1a222c;
            border: 2px solid #2d3748;
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        /* 懸停與選中效果 */
        .card:hover { border-color: #00d2ff; background: #1f2937; transform: translateY(-3px); }
        .card.active { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }

        .card h3 { color: #94a3b8; font-size: 0.9rem; margin: 0; }
        .card h2 { font-size: 2.8rem; margin: 10px 0; font-family: 'Courier New', monospace; }
        
        #temp-display { color: #ff6384; }
        #hum-display { color: #36a2eb; }

        /* 圖表區域：預設隱藏 */
        .chart-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out, opacity 0.5s;
            opacity: 0;
            background: #0f172a;
            border-radius: 12px;
            padding: 0 15px;
        }

        /* 展開時的樣式 */
        .chart-wrapper.show {
            max-height: 400px;
            opacity: 1;
            padding: 20px 15px;
            margin-top: 20px;
            border: 1px solid #1f2937;
        }

        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .offline { background: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h1 style="color:#00d2ff; font-size: 1.5rem;">LoRa 無線數據中心</h1>
            <div style="font-size: 0.8rem; color:#94a3b8;">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>
        
        <p style="color:#64748b; font-size: 0.8rem; margin-top:-10px;">點擊卡片切換歷史趨勢圖</p>

        <div class="card-container">
            <div class="card" id="temp-card" onclick="toggleChart('temp')">
                <h3>環境溫度</h3>
                <h2 id="temp-display">--<small style="font-size:1rem">°C</small></h2>
            </div>
            <div class="card" id="hum-card" onclick="toggleChart('hum')">
                <h3>環境濕度</h3>
                <h2 id="hum-display">--<small style="font-size:1rem">%</small></h2>
            </div>
        </div>

        <div id="chart-area" class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        let currentMode = null; // 'temp', 'hum', or null
        const chartWrapper = document.getElementById('chart-area');
        const ctx = document.getElementById('myChart').getContext('2d');

        // 初始化圖表
        const myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], fill: true, tension: 0.4 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { grid: { display: false } }, y: { grid: { color: '#1f2937' } } }
            }
        });

        function toggleChart(mode) {
            const tempCard = document.getElementById('temp-card');
            const humCard = document.getElementById('hum-card');

            if (currentMode === mode) {
                // 如果點擊已開啟的，則關閉
                currentMode = null;
                chartWrapper.classList.remove('show');
                tempCard.classList.remove('active');
                humCard.classList.remove('active');
            } else {
                // 開啟對應圖表
                currentMode = mode;
                chartWrapper.classList.add('show');
                
                // 切換卡片高亮狀態
                tempCard.classList.toggle('active', mode === 'temp');
                humCard.classList.toggle('active', mode === 'hum');

                // 立即更新一次圖表樣式
                updateChartStyle();
            }
        }

        function updateChartStyle() {
            const dataset = myChart.data.datasets[0];
            if (currentMode === 'temp') {
                dataset.label = '溫度歷史 (°C)';
                dataset.borderColor = '#ff6384';
                dataset.backgroundColor = 'rgba(255, 99, 132, 0.1)';
            } else {
                dataset.label = '濕度歷史 (%)';
                dataset.borderColor = '#36a2eb';
                dataset.backgroundColor = 'rgba(54, 162, 235, 0.1)';
            }
            myChart.update();
        }

        function fetchData() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    // 更新大數字顯示
                    document.getElementById('temp-display').innerHTML = `${data.temperature}<small style="font-size:1rem">°C</small>`;
                    document.getElementById('hum-display').innerHTML = `${data.humidity}<small style="font-size:1rem">%</small>`;
                    
                    // 狀態燈
                    const statusText = document.getElementById('status-text');
                    const statusDot = document.getElementById('status-dot');
                    statusText.innerText = data.status.toUpperCase();
                    statusDot.className = 'status-dot ' + (data.status === 'online' ? 'online' : 'offline');

                    // 如果圖表開啟中，更新數據
                    if (currentMode) {
                        myChart.data.labels = data.history.labels;
                        myChart.data.datasets[0].data = (currentMode === 'temp') ? data.history.temp : data.history.hum;
                        myChart.update('none');
                    }
                });
        }

        setInterval(fetchData, 3000); // 每 3 秒抓一次數據
        fetchData();
    </script>
</body>
</html>
