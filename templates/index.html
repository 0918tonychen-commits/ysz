<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa SCADA 數據監控中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0b1016; 
            color: #e2e8f0; 
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 900px; 
            background: #141a23; padding: 30px; 
            border-radius: 24px; border: 1px solid #2d3748;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00d2ff; font-size: 1.6rem; margin: 0; text-shadow: 0 0 10px rgba(0,210,255,0.3); }

        .status-tag { font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .offline { background: #ff4757; box-shadow: 0 0 10px #ff4757; }

        /* --- SCADA 網格配置 --- */
        .scada-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; margin-top: 20px; 
        }

        .card {
            background: #1a222c; border: 2px solid #2d3748;
            border-radius: 18px; padding: 20px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover { border-color: #00d2ff; background: #1f2937; transform: translateY(-5px); }
        .card.active { border-color: #00d2ff; background: #1f2937; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }

        .card h3 { color: #94a3b8; font-size: 0.85rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .card .val-row { display: flex; justify-content: space-around; align-items: baseline; margin-top: 10px; }
        .card h2 { font-size: 1.8rem; margin: 0; font-family: 'Consolas', monospace; }
        
        .temp-color { color: #ff6384; }
        .hum-color { color: #36a2eb; }

        .chart-wrapper {
            max-height: 0; overflow: hidden;
            transition: all 0.5s ease-in-out; opacity: 0;
            background: #0f172a; border-radius: 15px; margin-top: 0;
        }

        .chart-wrapper.show {
            max-height: 450px; opacity: 1;
            padding: 25px; margin-top: 25px; border: 1px solid #1f2937;
        }

        canvas { width: 100% !important; height: 320px !important; }
        .hint { color: #475569; font-size: 0.8rem; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LoRa SCADA 監控系統</h1>
            <div class="status-tag">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>
        
        <div id="scada-grid" class="scada-grid"></div>

        <div id="chart-area" class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>

        <p class="hint">💡 點擊監測點卡片可切換查看歷史數據圖表</p>
    </div>

    <script>
        // --- 1. SCADA 型號與單位對照表 ---
        const sensorConfig = {
            "s01": { name: "1號感測器", icon: "🏢" },
            "s02": { name: "2號感測器", icon: "🧪" },
            "s03": { name: "3號感測器", icon: "🖥️" },
            "s04": { name: "4號感測器", icon: "🌿" },
            "s05": { name: "5號感測器", icon: "⚡" }
        };

        let currentActiveNode = null;
        const chartWrapper = document.getElementById('chart-area');
        const ctx = document.getElementById('myChart').getContext('2d');

        Chart.defaults.color = '#94a3b8';
        const myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: '溫度', data: [], borderColor: '#ff6384', backgroundColor: 'rgba(255, 99, 132, 0.1)', fill: true, tension: 0.4 },
                { label: '濕度', data: [], borderColor: '#36a2eb', backgroundColor: 'rgba(54, 162, 235, 0.1)', fill: true, tension: 0.4 }
            ]},
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } } }
            }
        });

        // --- 2. 動態卡片生成器 ---
        function createCards() {
            const grid = document.getElementById('scada-grid');
            Object.keys(sensorConfig).forEach(id => {
                const conf = sensorConfig[id];
                const card = `
                    <div class="card" id="card-${id}" onclick="toggleChart('${id}')">
                        <h3>${conf.icon} ${conf.name}</h3>
                        <div class="val-row">
                            <h2 class="temp-color"><span id="${id}-t">--</span><small>°C</small></h2>
                            <h2 class="hum-color"><span id="${id}-h">--</span><small>%</small></h2>
                        </div>
                    </div>`;
                grid.insertAdjacentHTML('beforeend', card);
            });
        }

        function toggleChart(nodeId) {
            if (currentActiveNode === nodeId) {
                currentActiveNode = null;
                chartWrapper.classList.remove('show');
            } else {
                currentActiveNode = nodeId;
                chartWrapper.classList.add('show');
                // 清除其他卡片的亮起狀態
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                document.getElementById(`card-${nodeId}`).classList.add('active');
                setTimeout(() => myChart.resize(), 350);
            }
        }

        function fetchData() {
            fetch('/api/all_data') // 配合 SCADA 一對多後端路徑
                .then(res => res.json())
                .then(data => {
                    // 更新各卡片數值
                    Object.keys(sensorConfig).forEach(id => {
                        if(data[`${id}_t`]) document.getElementById(`${id}-t`).innerText = data[`${id}_t`].val;
                        if(data[`${id}_h`]) document.getElementById(`${id}-h`).innerText = data[`${id}_h`].val;
                    });

                    // 狀態燈與圖表更新
                    document.getElementById('status-text').innerText = data.status || "OFFLINE";
                    document.getElementById('status-dot').className = 'status-dot ' + (data.status === 'online' ? 'online' : 'offline');

                    if (currentActiveNode && data.history && data.history[currentActiveNode]) {
                        const h = data.history[currentActiveNode];
                        myChart.data.labels = h.labels;
                        myChart.data.datasets[0].data = h.temp;
                        myChart.data.datasets[1].data = h.hum;
                        myChart.update('none');
                    }
                });
        }

        createCards(); // 初始化生成五張卡片
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
