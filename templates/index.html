<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa SCADA 智能監控中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- 玻璃擬態 CSS 樣式 --- */
        body { font-family: 'Segoe UI', sans-serif; background: #0b1016; color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 950px; background: rgba(20, 26, 35, 0.85); padding: 30px; border-radius: 28px; border: 1px solid rgba(0, 210, 255, 0.2); backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #00d2ff; font-size: 1.8rem; margin: 0; text-shadow: 0 0 15px rgba(0,210,255,0.5); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .online { background: #00ff88; box-shadow: 0 0 12px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .offline { background: #ff4757; box-shadow: 0 0 10px #ff4757; }
        .scada-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #1e293b; border-radius: 20px; padding: 22px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: #00d2ff; }
        .card.active { background: rgba(0, 210, 255, 0.1); border-color: #00d2ff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        .val-row { display: flex; justify-content: space-around; margin-top: 15px; flex-wrap: wrap; }
        .val-item { text-align: center; flex: 1; }
        .temp-color { color: #ff6384; filter: drop-shadow(0 0 5px #ff6384); }
        .hum-color { color: #36a2eb; filter: drop-shadow(0 0 5px #36a2eb); }
        .air-color { color: #00ff88; filter: drop-shadow(0 0 5px #00ff88); }
        .pm-color { color: #7bed9f; filter: drop-shadow(0 0 5px #7bed9f); }
        
        .chart-wrapper { max-height: 0; overflow: hidden; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        .chart-wrapper.show { max-height: 500px; opacity: 1; padding-top: 25px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .scroll-container { width: 100%; overflow-x: auto; scroll-behavior: smooth; }
        .scroll-container::-webkit-scrollbar { height: 6px; }
        .scroll-container::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.3); border-radius: 10px; }
        .canvas-holder { height: 320px; min-width: 100%; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LoRa SCADA 監控系統</h1>
            <div class="status-tag">
                <span id="status-dot" class="status-dot offline"></span>
                <span id="status-text">SYSTEM OFFLINE</span>
            </div>
        </div>
        
        <div id="scada-grid" class="scada-grid"></div>

        <div id="chart-area" class="chart-wrapper">
            <div class="scroll-container" id="scroll-box">
                <div class="canvas-holder" id="canvas-container">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>
        <p style="text-align:center; color:#475569; margin-top:20px; font-size: 0.9rem;">⚡ 點擊卡片顯示趨勢 | 左右滑動查看歷史</p>
    </div>

    <script>
        const sensorConfig = {
            "s01": { name: "1號環境站", icon: "🌡️", type: "env" },
            "s02": { name: "空氣品質全監測", icon: "🌬️", type: "air_all" },
            "s03": { name: "懸浮微粒監測", icon: "😷", type: "pm_data" }
        };

        let currentActiveNode = null;
        let units = {}; 
        let initialLoadMap = {}; 
        const ctx = document.getElementById('myChart').getContext('2d');
        
        const myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                    y: { 
                        type: 'linear', display: true, position: 'left',
                        beginAtZero: true,
                        ticks: { color: '#e2e8f0' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        title: { display: true, text: '數值', color: '#94a3b8' }
                    },
                    y1: { 
                        type: 'linear', display: false, position: 'right',
                        beginAtZero: true,
                        ticks: { color: '#00ff88' },
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: 'CO2 (ppm)', color: '#94a3b8' }
                    }
                }
            }
        });

        function createCards() {
            const grid = document.getElementById('scada-grid');
            Object.keys(sensorConfig).forEach(id => {
                const conf = sensorConfig[id];
                let content = "";
                if (conf.type === "env") {
                    content = `<div class="val-item"><h2 class="temp-color"><span id="${id}-t">--</span><small id="${id}-t-unit"></small></h2></div>
                               <div class="val-item"><h2 class="hum-color"><span id="${id}-h">--</span><small id="${id}-h-unit"></small></h2></div>`;
                } else if (conf.type === "air_all") {
                    content = `<div style="width:100%; text-align:center; margin-bottom:10px;"><h2 class="air-color"><span id="${id}-co2">--</span><small id="${id}-co2-unit"></small></h2></div>
                               <div class="val-row" style="width:100%; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;"><div class="temp-color"><span id="${id}-t">--</span>°C</div><div class="hum-color"><span id="${id}-h">--</span>%</div></div>`;
                } else if (conf.type === "pm_data") {
                    content = `<div class="val-item"><span style="font-size:0.7rem;color:#94a3b8">PM2.5</span><h2 class="pm-color"><span id="${id}-pm25">--</span></h2></div>
                               <div class="val-item"><span style="font-size:0.7rem;color:#94a3b8">PM10</span><h2 class="pm-color" style="filter:hue-rotate(45deg)"><span id="${id}-pm10">--</span></h2></div>`;
                }
                grid.insertAdjacentHTML('beforeend', `
                    <div class="card" id="card-${id}" onclick="toggleChart('${id}')">
                        <h3 style="margin:0; font-size:1rem; color:#94a3b8">${conf.icon} ${conf.name}</h3>
                        <div class="val-row">${content}</div>
                    </div>`);
            });
        }

        function toggleChart(nodeId) {
            const wrapper = document.getElementById('chart-area');
            const cards = document.querySelectorAll('.card');
            if (currentActiveNode === nodeId) {
                currentActiveNode = null;
                wrapper.classList.remove('show');
                cards.forEach(c => c.classList.remove('active'));
            } else {
                initialLoadMap[nodeId] = false; 
                currentActiveNode = nodeId;
                wrapper.classList.add('show');
                cards.forEach(c => c.classList.remove('active'));
                document.getElementById(`card-${nodeId}`).classList.add('active');
                fetchData();
            }
        }

        function fetchData() {
            fetch('/api/all_data')
                .then(res => res.json())
                .then(data => {
                    units = data.units || {}; 
                    Object.keys(sensorConfig).forEach(id => {
                        ["t", "h", "co2", "voc", "vib", "pm25", "pm10"].forEach(m => {
                            const valElem = document.getElementById(`${id}-${m}`);
                            if (valElem && data[`${id}_${m}`]) {
                                valElem.innerText = data[`${id}_${m}`].val;
                                const unitElem = document.getElementById(`${id}-${m}-unit`);
                                if (unitElem && units[m]) unitElem.innerText = units[m];
                            }
                        });
                    });

                    const isOnline = data.status === 'online';
                    document.getElementById('status-text').innerText = isOnline ? 'SYSTEM ONLINE' : 'SYSTEM OFFLINE';
                    document.getElementById('status-dot').className = `status-dot ${isOnline ? 'online' : 'offline'}`;

                    if (currentActiveNode && data.history && data.history[currentActiveNode]) {
                        const h = data.history[currentActiveNode];
                        const type = sensorConfig[currentActiveNode].type;
                        
                        // 動態寬度設定
                        const dataCount = h.labels.length;
                        const containerWidth = document.getElementById('scroll-box').clientWidth;
                        const targetWidth = Math.max(containerWidth, dataCount * 60);
                        document.getElementById('canvas-container').style.width = targetWidth + 'px';

                        // 修正跳動：控制動畫時間
                        let animDuration = initialLoadMap[currentActiveNode] ? 0 : 1000;
                        initialLoadMap[currentActiveNode] = true;

                        // 修正 Y 軸：清除鎖定值
                        myChart.options.scales.y.min = null;
                        myChart.options.scales.y.max = null;
                        myChart.options.scales.y1.display = (type === "air_all");

                        myChart.data.labels = h.labels || [];
                        
                        let newDatasets = [];
                        if (type === "env") {
                            newDatasets = [
                                { label: `溫度 (°C)`, data: h.temp.map(Number), borderColor: '#ff6384', yAxisID: 'y', tension: 0.4 },
                                { label: `濕度 (%)`, data: h.hum.map(Number), borderColor: '#36a2eb', yAxisID: 'y', tension: 0.4 }
                            ];
                        } else if (type === "air_all") {
                            newDatasets = [
                                { label: `CO2 (ppm)`, data: h.co2.map(Number), borderColor: '#00ff88', yAxisID: 'y1', tension: 0.4, fill: true, backgroundColor: 'rgba(0,255,136,0.1)' },
                                { label: `溫度 (°C)`, data: h.temp.map(Number), borderColor: '#ff6384', yAxisID: 'y', tension: 0.4 },
                                { label: `濕度 (%)`, data: h.hum.map(Number), borderColor: '#36a2eb', yAxisID: 'y', tension: 0.4 }
                            ];
                        } else if (type === "pm_data") {
                            newDatasets = [
                                { label: `PM2.5 (μg/m³)`, data: h.pm25.map(Number), borderColor: '#00ff88', yAxisID: 'y', tension: 0.4, fill: true, backgroundColor: 'rgba(0,255,136,0.1)' },
                                { label: `PM10 (μg/m³)`, data: h.pm10.map(Number), borderColor: '#7bed9f', yAxisID: 'y', tension: 0.4 }
                            ];
                        }

                        myChart.data.datasets = newDatasets;
                        myChart.update({ duration: animDuration }); 
                        
                        const scrollBox = document.getElementById('scroll-box');
                        setTimeout(() => { scrollBox.scrollLeft = scrollBox.scrollWidth; }, 100);
                    }
                });
        }

        createCards();
        fetchData();
        setInterval(fetchData, 3000); 
    </script>
</body>
</html>
