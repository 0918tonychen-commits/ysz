<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>LORA 環境監測系統</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    /* ── 🌌 終極 Cyberpunk 極簡科技渲染 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root { 
      --bg: #050914; 
      --surface: rgba(15, 23, 32, 0.85); 
      --main-accent: #ffffff; 
      --green: #39ff14; 
      --red: #ff003c; 
      --blue: #0088ff; 
      --yellow: #f9ca24;
      --purple: #a29bfe;
      --muted: #636e72; 
      --text: #d1d8e0; 
      --grid-line: rgba(255, 255, 255, 0.05);
    }

    body { 
      font-family: 'Consolas', 'Courier New', monospace; 
      background-color: var(--bg);
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text); 
      padding: 30px 20px; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .container { width: 100%; max-width: 1100px; }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid var(--grid-line); padding-bottom: 15px; }
    .header h1 { font-size: 1.8rem; color: var(--main-accent); letter-spacing: 3px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); text-transform: uppercase; margin-bottom: 5px; }
    
    .status-badge { 
      padding: 6px 16px; border-radius: 4px; border: 1px solid var(--muted); 
      font-size: 0.72rem; background: rgba(0,0,0,0.5); letter-spacing: 1px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .is-online { border-color: var(--green); color: var(--green); text-shadow: 0 0 8px var(--green); box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2); }
    .pulse { display: inline-block; width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 8px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1; box-shadow:0 0 8px currentColor;} 50%{opacity:0.2; box-shadow:none;} }

    .scada-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; transition: 0.4s; }
    
    .card { 
      background: var(--surface); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 8px; 
      padding: 20px; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      height: 270px; /* 🌟 絕對固定高度，排版絕不混亂 */
      display: flex;
      flex-direction: column;
    }
    .card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--muted); transition: 0.3s; }
    .card:hover { transform: translateY(-5px); border-color: var(--main-accent); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.1); }
    .card:hover::before { background: var(--main-accent); box-shadow: 0 0 10px var(--main-accent); }
    
    .card.active { border-color: var(--main-accent); box-shadow: 0 0 25px rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); }
    .card.active::before { background: var(--main-accent); box-shadow: 0 0 15px var(--main-accent); }
    
    .hidden { display: none !important; }

    .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-title { font-size: 0.8rem; color: var(--text); display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
    
    .signal-bars { display: flex; gap: 2px; align-items: flex-end; width: 20px; height: 14px; }
    .bar { width: 3px; background: rgba(0,0,0,0.5); border: 0.5px solid var(--muted); transition: 0.3s; }
    .bar-1 { height: 25%; } .bar-2 { height: 50%; } .bar-3 { height: 75%; } .bar-4 { height: 100%; }
    
    .signal-bars.excellent .bar { background: var(--green); border-color: transparent; box-shadow: 0 0 5px var(--green); }
    .signal-bars.good .bar { border-color: transparent; }
    .signal-bars.good .bar-1, .signal-bars.good .bar-2, .signal-bars.good .bar-3 { background: var(--main-accent); box-shadow: 0 0 5px var(--main-accent); }
    .signal-bars.fair .bar { border-color: transparent; }
    .signal-bars.fair .bar-1, .signal-bars.fair .bar-2 { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
    .signal-bars.poor .bar { border-color: transparent; }
    .signal-bars.poor .bar-1 { background: var(--muted); box-shadow: 0 0 5px var(--muted); }
    
    .data-section { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; margin-bottom: 5px; }
    .divider { width: 100%; height: 1px; background: rgba(255, 255, 255, 0.05); margin: 5px 0 10px 0; border-top: 1px dashed rgba(255, 255, 255, 0.1); }
    
    .val-item { flex: 1 1 40%; }
    .val-num { font-size: 1.6rem; font-weight: bold; text-shadow: 0 0 10px currentColor; }
    .val-label { font-size: 0.6rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

    .card-meta { font-size: 0.6rem; color: var(--muted); display: flex; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.03); }

    @keyframes skeleton-pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .skeleton { animation: skeleton-pulse 1.2s infinite; background-color: rgba(255,255,255,0.03); border-radius: 4px; color: transparent !important; text-shadow: none !important; }
    .skeleton::after { content: " "; display: block; height: 100%; }

    .chart-panel { 
      background: var(--surface); border-radius: 8px; border: 1px solid var(--main-accent); 
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05); max-height: 0; opacity: 0; overflow: hidden; 
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); margin-top: 20px; 
    }
    .chart-panel.show { max-height: 600px; opacity: 1; padding: 20px; }

    .chart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); margin-bottom: 15px; }
    
    .chart-scroll-box { width: 100%; overflow-x: auto; background: #02040a; border-radius: 4px; padding: 10px; border: 1px solid #111b27; }
    .chart-scroll-box::-webkit-scrollbar { height: 8px; }
    .chart-scroll-box::-webkit-scrollbar-thumb { background: var(--main-accent); border-radius: 4px; }
    .chart-scroll-box::-webkit-scrollbar-track { background: #02040a; }
    .chart-content { min-width: 1200px; height: 350px; position: relative; } 

    .btn { 
      background: transparent; border: 1px solid var(--main-accent); color: var(--main-accent); 
      padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; 
      text-transform: uppercase; transition: 0.3s; box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
    }
    .btn:hover { background: var(--main-accent); color: #000; box-shadow: 0 0 15px var(--main-accent); }
    
    .btn-danger { border-color: var(--red); color: var(--red); box-shadow: inset 0 0 5px rgba(255, 0, 60, 0.2); }
    .btn-danger:hover { background: var(--red); color: #fff; box-shadow: 0 0 15px var(--red); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>LORA 環境監測系統</h1>
      <p style="color:var(--muted); font-size:0.7rem; letter-spacing:1px;">NTNU VEHICLE ENERGY Engineering - MULTI NODE</p>
    </div>
    <div id="status-badge" class="status-badge"><span class="pulse" id="status-dot"></span><span id="status-text">SYSTEM.INIT...</span></div>
  </div>

  <div id="scada-grid" class="scada-grid"></div>

  <div id="chart-panel" class="chart-panel">
    <div class="chart-header">
      <div id="legend-container" style="display:flex; gap:20px; font-size:0.85rem; align-items:center;"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="exportExcel()">[ DOWNLOAD.XLSX ]</button> 
        <button class="btn btn-danger" onclick="closeChart()">[ CLOSE ]</button>
      </div>
    </div>
    <div class="chart-scroll-box">
      <div class="chart-content">
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ── 動態配置區 ──
let SENSOR_CONFIG = {}; 
let activeNode = null;
let chart = null;

// ── 動態生成 UI 骨架 (優化自然排序版) ──
function initCards() {
  const grid = document.getElementById('scada-grid');
  grid.innerHTML = ''; 
  
  Object.entries(SENSOR_CONFIG)
    .sort((a, b) => a[0].localeCompare(b[0], undefined, {numeric: true, sensitivity: 'base'}))
    .forEach(([id, conf]) => {
      
    const card = document.createElement('div');
    card.className = 'card'; card.id = `card-${id}`;
    card.onclick = () => toggleChart(id);
    
    if (activeNode === id) card.classList.add('active');
    
    // 區分環境數據與通訊指標
    const envSensors = conf.sensors.filter(s => s !== 'mcount' && s !== 'snr' && s !== 'loss');
    const netSensors = conf.sensors.filter(s => s === 'mcount' || s === 'snr' || s === 'loss');
    
    let html = `
      <div class="card-title-row">
        <div class="card-title">${conf.icon} ${conf.name}</div>
        <div class="signal-bars skeleton" id="${id}-signal" title="通訊品質">
          <div class="bar bar-1"></div><div class="bar bar-2"></div><div class="bar bar-3"></div><div class="bar bar-4"></div>
        </div>
      </div>`;
      
    if (envSensors.length > 0) {
      html += `<div class="data-section">`;
      envSensors.forEach(s => {
        html += `
          <div class="val-item">
            <div class="val-label">${s.toUpperCase()}</div>
            <div class="val-num skeleton" style="color:var(--text)"><span id="${id}-${s}">--</span></div>
          </div>`;
      });
      html += `</div>`;
    }

    if (netSensors.length > 0) {
      html += `<div class="divider"></div><div class="data-section">`;
      netSensors.forEach(s => {
        // 如果是 mcount 標籤，畫面上顯示為 M_NO (流水號縮寫)
        const displayLabel = s === 'mcount' ? 'M_NO' : s.toUpperCase();
        html += `
          <div class="val-item">
            <div class="val-label">${displayLabel}</div>
            <div class="val-num skeleton" style="color:var(--text)"><span id="${id}-${s}">--</span></div>
          </div>`;
      });
      html += `</div>`;
    }
    
    html += `
      <div class="card-meta">
        <span>STATUS: <span id="${id}-status">CHECKING...</span></span>
        <span>LAST: <span id="${id}-time" class="skeleton">00:00:00</span></span>
      </div>`;
      
    card.innerHTML = html; grid.appendChild(card);
  });
}

// ── 初始化圖表 ──
try {
  const ctx = document.getElementById('myChart').getContext('2d');
  Chart.defaults.color = '#64748b';
  Chart.defaults.font.family = 'Consolas';
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { 
        legend: { display: false },
        tooltip: { backgroundColor: 'rgba(5, 9, 20, 0.9)', titleColor: '#ffffff', borderColor: '#ffffff', borderWidth: 1 }
      }, 
      scales: {
        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } }
      }
    }
  });
} catch (error) {}

function toggleChart(id) {
  if (activeNode === id) {
    closeChart();
    return;
  }
  activeNode = id;
  document.querySelectorAll('.card').forEach(c => {
    if (c.id === `card-${id}`) {
      c.classList.remove('hidden');
      c.classList.add('active');
    } else {
      c.classList.add('hidden'); 
    }
  });
  document.getElementById('chart-panel').classList.add('show');
  fetchData(); 
}

// 🌟 【Bug 修正】拔除錯誤的 .remove('show')，捍衛網頁二次點擊時的 DOM 生命週期
function closeChart() { 
  activeNode = null; 
  document.getElementById('chart-panel').classList.remove('show'); 
  setTimeout(() => {
    document.querySelectorAll('.card').forEach(c => {
      c.classList.remove('hidden');
      c.classList.remove('active');
    });
  }, 300); 
}

// ── 🛡️ 智慧防禦型圖表繪製 ──
function renderChart(id, h) {
  if (!chart || !SENSOR_CONFIG[id]) return; 
  
  try {
    const MAX_POINTS = 100; 
    let labels = h.labels || [];
    if (labels.length > MAX_POINTS) labels = labels.slice(-MAX_POINTS);
    chart.data.labels = labels;
    
    const datasets = [];
    const legendBox = document.getElementById('legend-container');
    legendBox.innerHTML = `<span style="color:var(--main-accent); font-weight:bold; border-right:2px solid var(--muted); padding-right:15px;">DATA STREAM // ${SENSOR_CONFIG[id].name}</span>`;
    
    // 🌟 修正：對齊環境縮寫與標準全名，補齊極簡白的主視覺色系映射
    const colorMap = { temp: '#f9ca24', hum: '#39ff14', co2: '#ffffff', pm25: '#ffffff', pm10: '#f9ca24', t: '#f9ca24', h: '#39ff14', c: '#ffffff' };
    
    // 固定排除圖表上的通訊與流水號欄位，保持環境數據 Y 軸刻度精準不被拉扁
    const keys = Object.keys(h).filter(k => k !== 'labels' && k !== 'rssi' && k !== 'r_in' && k !== 'mcount' && k !== 'snr' && k !== 'loss');
    
    chart.options.scales = {
      x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } },
      y: { display: false, position: 'left', grid: { drawOnChartArea: true }, ticks: {} },
      y1: { display: false, position: 'right', grid: { drawOnChartArea: false }, ticks: {} }
    };

    keys.forEach((k) => {
      const color = colorMap[k] || '#ffffff';
      legendBox.innerHTML += `<span style="color:${color}; text-shadow:0 0 5px ${color};">■ ${k.toUpperCase()}</span>`;
      
      let axisId = (k === 't' || k === 'h' || k === 'temp' || k === 'hum') ? 'y1' : 'y';
      
      chart.options.scales[axisId].display = true;
      chart.options.scales[axisId].ticks.color = color; 

      if (axisId === 'y1') {
        chart.options.scales[axisId].min = 0;
        chart.options.scales[axisId].max = 100;
      } else {
        if (k === 'c' || k === 'co2') {
          chart.options.scales[axisId].suggestedMin = 400;
          chart.options.scales[axisId].suggestedMax = 1500;
        } else if (k.includes('pm')) {
          chart.options.scales[axisId].suggestedMin = 0;
          chart.options.scales[axisId].suggestedMax = 50;
        }
      }

      let dataArr = (h[k] ?? []).map(Number);
      if (dataArr.length > MAX_POINTS) dataArr = dataArr.slice(-MAX_POINTS);
      while(dataArr.length < labels.length) dataArr.unshift(dataArr[0] || 0);
      if(dataArr.length > labels.length) dataArr = dataArr.slice(-labels.length);

      datasets.push({
        label: k.toUpperCase(), 
        data: dataArr,
        borderColor: color, 
        backgroundColor: color,
        yAxisID: axisId,
        borderWidth: 2, 
        tension: 0.3, 
        pointRadius: 3, 
        pointBackgroundColor: '#050914' 
      });
    });

    chart.data.datasets = datasets;
    chart.update('none');
    
    const scrollBox = document.querySelector('.chart-scroll-box');
    if(scrollBox) scrollBox.scrollLeft = scrollBox.scrollWidth;
    
  } catch(err) {
    console.error("渲染攔截:", err);
  }
}

// ── 自動化數據獲取與動態解析 ──
async function fetchData() {
  try {
    const res = await fetch('/api/all_data');
    const data = await res.json();
    const nowTime = new Date().toLocaleTimeString('zh-TW', { hour12: false });

    let configChanged = false;

    // 自動偵測未知節點與感測器
    Object.keys(data).forEach(key => {
      if (key.match(/^s\d+_[a-z0-9]+$/i) && !key.includes('rssi') && !key.includes('r_in')) {
        const parts = key.split('_');
        const id = parts[0];     
        const sensor = parts[1]; 
        
        if (!SENSOR_CONFIG[id]) {
          SENSOR_CONFIG[id] = { name: `NODE_${id.toUpperCase().replace('S', '')}`, icon: '📍', sensors: [] };
          configChanged = true;
        }
        
        if (!SENSOR_CONFIG[id].sensors.includes(sensor)) {
          SENSOR_CONFIG[id].sensors.push(sensor);
          SENSOR_CONFIG[id].sensors.sort();
          configChanged = true;
        }
      }
    });

    if (configChanged) {
      initCards();
    }

    // 數據更新寫入 UI
    Object.entries(SENSOR_CONFIG).forEach(([id, conf]) => {
      let nodeActive = false; 

      conf.sensors.forEach(s => {
        const spanEl = document.getElementById(`${id}-${s}`);
        if(spanEl) {
          const valData = data[`${id}_${s}`];
          if (valData) {
            spanEl.textContent = valData.val;
            nodeActive = true; 
            spanEl.parentElement.classList.remove('skeleton'); 
            
            // 🌟 欄位警示色分流：MCOUNT 與 LOSS、SNR 設為紅色警示，其餘回歸高質感主題色
            const color = s === 't' ? 'var(--yellow)' : s === 'h' ? 'var(--green)' : (s === 'mcount' || s === 'snr' || s === 'loss') ? 'var(--red)' : 'var(--main-accent)';
            spanEl.parentElement.style.color = color;
          }
        }
      });

      const timeEl = document.getElementById(`${id}-time`);
      const statusEl = document.getElementById(`${id}-status`);
      const signalEl = document.getElementById(`${id}-signal`);

      if (nodeActive) {
        timeEl.textContent = nowTime;
        timeEl.classList.remove('skeleton'); 
        statusEl.textContent = 'ONLINE';
        statusEl.style.color = 'var(--green)';

        const rssi = data[`${id}_rssi`]?.val ? parseFloat(data[`${id}_rssi`].val) : -100;
        let quality = 'poor';
        if (rssi > -70) quality = 'excellent';
        else if (rssi > -85) quality = 'good';
        else if (rssi > -100) quality = 'fair';
        
        signalEl.className = `signal-bars ${quality}`;
        signalEl.title = `RSSI: ${Math.round(rssi)} dBm`;
      } else {
        statusEl.textContent = 'PENDING...';
        statusEl.style.color = 'var(--muted)';
        signalEl.className = 'signal-bars'; 
      }
      if(signalEl) signalEl.classList.remove('skeleton'); 
    });

    const isOnline = data.status === 'online';
    document.getElementById('status-badge').className = `status-badge ${isOnline ? 'is-online' : ''}`;
    document.getElementById('status-text').textContent = isOnline ? 'SYSTEM.ONLINE' : 'SYSTEM.OFFLINE';
    if(activeNode && data.history[activeNode]) renderChart(activeNode, data.history[activeNode]);
  } catch(e) {}
}

// ── Excel 完美匯出 ──
function exportExcel() {
  if (!activeNode) return;
  fetch('/api/all_data').then(res => res.json()).then(data => {
    const hist = data.history[activeNode];
    const ks = Object.keys(hist).filter(k => k !== 'labels');
    
    let sheetData = [ ["Time", ...ks.map(k => k.toUpperCase())] ];
    
    for(let i = 0; i < hist.labels.length; i++) {
      let row = [hist.labels[i]]; 
      ks.forEach(k => {
        let val = hist[k][i];
        row.push(val !== undefined && val !== null && val !== "" ? Number(val) : null);
      });
      sheetData.push(row);
    }
    
    const worksheet = XLSX.utils.aoa_to_sheet(sheetData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, `${activeNode}_Data`);
    XLSX.writeFile(workbook, `${activeNode}_DATA.xlsx`);
  });
}

fetchData(); 
setInterval(fetchData, 3000);
</script>
</body>
</html>
