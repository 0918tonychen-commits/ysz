<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa 實時監測站</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .online { background-color: #4caf50; }
        .offline { background-color: #f44336; }
        .chart-box { margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LoRa 環境監測站</h1>
        <p>狀態: <span id="status-text">檢查中...</span> <span id="status-dot" class="status-dot"></span></p>
        
        <div style="display: flex; justify-content: space-around;">
            <div>
                <h3>溫度</h3>
                <h2 id="temp-val">-- °C</h2>
            </div>
            <div>
                <h3>濕度</h3>
                <h2 id="hum-val">-- %</h2>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: '溫度 (°C)',
                        data: [],
                        borderColor: '#ff6384',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        yAxisID: 'y',
                        tension: 0.3
                    },
                    {
                        label: '濕度 (%)',
                        data: [],
                        borderColor: '#36a2eb',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        yAxisID: 'y1',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { type: 'linear', position: 'left', title: { display: true, text: '溫度' } },
                    y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '濕度' } }
                }
            }
        });

        function fetchData() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    // 更新數字
                    document.getElementById('temp-val').innerText = data.temperature;
                    document.getElementById('hum-val').innerText = data.humidity;
                    
                    // 更新狀態燈
                    const dot = document.getElementById('status-dot');
                    const text = document.getElementById('status-text');
                    text.innerText = data.status.toUpperCase();
                    dot.className = 'status-dot ' + data.status;

                    // 更新圖表
                    myChart.data.labels = data.history.labels;
                    myChart.data.datasets[0].data = data.history.temp;
                    myChart.data.datasets[1].data = data.history.hum;
                    myChart.update('none'); // 靜默更新不觸發動畫，效能較好
                });
        }

        // 每 3 秒抓一次數據
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
