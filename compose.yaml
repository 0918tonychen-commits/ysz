services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ysz
      POSTGRES_PASSWORD: ysz-local-development
      POSTGRES_DB: ysz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysz -d ysz"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  website:
    build: .
    environment:
      DATABASE_URL: postgresql://ysz:ysz-local-development@database:5432/ysz
      LORA_API_KEY: ${LORA_API_KEY:-ysz-local-development-only}
      DISCORD_WEBHOOK_URL: ""
      OFFLINE_TIMEOUT_SECONDS: 180
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:10000:10000"

volumes:
  postgres-data:
